name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# Do not cancel in-progress runs as we want to allow production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-validate:
    name: Build & Validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Validate static files integrity
        run: |
          echo "Checking required files..."
          test -f index.html || { echo "Error: index.html missing"; exit 1; }
          test -f styles.css || { echo "Error: styles.css missing"; exit 1; }
          test -f CNAME || { echo "Error: CNAME missing"; exit 1; }
          echo "Core static files verified."

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Check asset links and references
        run: |
          node -e '
            const fs = require("fs");
            const html = fs.readFileSync("index.html", "utf8");
            const srcRegex = /(?:src|href)=["\x27](assets\/[^"\x27]+)["\x27]/g;
            let match;
            let missing = 0;
            while ((match = srcRegex.exec(html)) !== null) {
              const file = match[1];
              if (!fs.existsSync(file)) {
                console.error(`Error: Referenced asset not found: ${file}`);
                missing++;
              } else {
                console.log(`Asset verified: ${file}`);
              }
            }
            if (missing > 0) {
              process.exit(1);
            }
            console.log("All referenced asset links are valid.");
          '

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

  deploy:
    name: Deploy to GitHub Pages
    needs: build-and-validate
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
